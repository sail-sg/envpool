name: Lint

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip
      - name: ruff check
        run: |
          make ruff
      - name: ruff format
        run: |
          make py-format
      - name: cpplint
        run: |
          make cpplint
      - name: clang-format
        run: |
          make CLANG_FORMAT_BIN=clang-format-20 clang-format
      - name: buildifier
        run: |
          make buildifier
      - name: addlicense
        run: |
          make addlicense
      - name: mypy
        run: |
          make mypy
      - name: docstyle
        run: |
          make docstyle
      - name: spelling
        run: |
          make spelling
