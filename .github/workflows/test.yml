name: Bazel Build and Test
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  test-linux-arm64:
    name: Test (linux-arm64)
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-linux-arm64
      cancel-in-progress: false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    env:
      CACHE_BRANCH: ${{ github.head_ref || github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      # Keep hosted Linux runners responsive during the full MuJoCo/MyoSuite test
      # build. The default HOST_CPUS-1 parallelism can starve the runner hard
      # enough for GitHub Actions to lose communication.
      # Match the official arm64 MuJoCo wheel's Clang 20 toolchain so contact-
      # heavy oracle rollouts do not diverge from GCC-generated physics code.
      BAZEL_CI_RESOURCE_OPTS: >-
        --repo_env=CC=/usr/bin/clang-20
        --repo_env=CXX=/usr/bin/clang++-20
        --compiler=clang
        --jobs=2 --local_resources=cpu=2 --local_resources=memory=HOST_RAM*.35
        --experimental_disk_cache_gc_max_size=2G --experimental_disk_cache_gc_idle_delay=0s
      MUJOCO_GL: egl
      EGL_PLATFORM: surfaceless
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-20 cmake lcov ninja-build swig qt6-base-dev libegl1-mesa-dev libopengl-dev libx11-dev libxext-dev
          python -m pip install --upgrade cmake
      - name: Restore Bazel caches
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/envpool-bazel-repo
            ~/.cache/envpool-bazel-disk
          key: bazel-test-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion') }}-${{ env.CACHE_BRANCH }}
          restore-keys: |
            bazel-test-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion') }}-${{ env.DEFAULT_BRANCH }}-
            bazel-test-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion') }}-
      - name: Install bazelisk
        run: |
          go install github.com/bazelbuild/bazelisk@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Compare Hand control rounding on ARM
        run: |
          echo 'DIAGNOSTIC_PHASE contract-off'
          make BAZEL_TEST_TARGETS="//envpool/mujoco:robotics_test" BAZELOPT="--repository_cache=$HOME/.cache/envpool-bazel-repo --disk_cache=$HOME/.cache/envpool-bazel-disk $BAZEL_CI_RESOURCE_OPTS --test_arg=_GymnasiumRoboticsHandEnvPoolTest.test_align_with_upstream_rollout" bazel-test || true
          python3 -c 'from pathlib import Path; p=Path("envpool/mujoco/robotics/hand.h"); p.write_text(p.read_text().replace("#if defined(__clang__)\n#pragma clang fp contract(off)", "#if defined(__clang__) && defined(__APPLE__)\n#pragma clang fp contract(off)"))'
          echo 'DIAGNOSTIC_PHASE compiler-default'
          make BAZEL_TEST_TARGETS="//envpool/mujoco:robotics_test" BAZELOPT="--repository_cache=$HOME/.cache/envpool-bazel-repo --disk_cache=$HOME/.cache/envpool-bazel-disk $BAZEL_CI_RESOURCE_OPTS --test_arg=_GymnasiumRoboticsHandEnvPoolTest.test_align_with_upstream_rollout" bazel-test || true
          git show 46c5417094a121b57834867d22146fa922d969d3:envpool/mujoco/robotics/hand.h > envpool/mujoco/robotics/hand.h
          git show 46c5417094a121b57834867d22146fa922d969d3:envpool/mujoco/robotics/robotics_test.py > envpool/mujoco/robotics/robotics_test.py
          python3 -c 'from pathlib import Path; p=Path("envpool/mujoco/robotics/hand.h"); p.write_text(p.read_text().replace("#if defined(__clang__)", "#if defined(__clang__) && defined(__APPLE__)"))'
          echo 'VALIDATION_PHASE full robotics'
          make BAZEL_TEST_TARGETS="//envpool/mujoco:robotics_test" BAZELOPT="--repository_cache=$HOME/.cache/envpool-bazel-repo --disk_cache=$HOME/.cache/envpool-bazel-disk $BAZEL_CI_RESOURCE_OPTS" bazel-test
      - name: Shut down Bazel
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        run: bazelisk shutdown
